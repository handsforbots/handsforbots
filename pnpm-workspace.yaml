packages:
  - packages/*
  - examples/react-agui
  - examples/voice-lab

# Security floors for transitive dependencies flagged by `pnpm audit`.
# Remove an entry once every dependent resolves a patched version on its own.
overrides:
  'vite@>=8.3.0 <8.3.3': ^8.3.3 # GHSA-9jrq-w75r-8gcw and related (via vitest)
  'zod@>=4.0.0 <4.6.6': ^4.6.6 # GHSA-mrhx-c7xc-m3w5 (via @ag-ui/core)
  'dompurify@<3.4.17': ^3.4.17 # GHSA-cg2g-xh64-v4q7 (via @copilotkit/react-core > mermaid)
  'undici@>=7.0.0 <7.30.1': ^7.30.1 # GHSA-2m5v-pch6-74hx and related (via ai)
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0 # GHSA-27r3-jxmh-p828 (via @modelcontextprotocol/sdk)
