packages:
  - packages/*
  - examples/react-agui
  - examples/voice-lab

# Security floors for transitive dependencies flagged by `pnpm audit`.
# Remove an entry once every dependent resolves a patched version on its own.
overrides:
  'vite@>=8.3.0 <8.3.3': ^8.3.3 # GHSA-9jrq-w75r-8gcw and related (via vitest)
  'dompurify@<3.4.17': ^3.4.17 # GHSA-cg2g-xh64-v4q7 (via @copilotkit/react-core > mermaid)
  'undici@>=7.0.0 <7.30.1': ^7.30.1 # GHSA-2m5v-pch6-74hx and related (via ai)
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0 # GHSA-27r3-jxmh-p828 (via @modelcontextprotocol/sdk)
  'hono@<4.13.16': ^4.13.16 # GHSA-46wx-v44x-9hh2 and related (via @copilotkit/react-core > @modelcontextprotocol/sdk)
  '@hono/node-server@>=2.0.0 <2.1.6': ^2.1.6 # GHSA-qv5m-9pm6-hqp3, GHSA-jpvv-r467-5p4w (via @modelcontextprotocol/sdk)
  'qs@>=6.7.0 <6.16.1': ^6.16.1 # GHSA-6pq8-jhm2-2vcw (via express)
  'fast-uri@>=3.0.0 <3.1.9': ^3.1.9 # GHSA-w74x-v6f9-j3xg and related (via ajv)
  'ip-address@<10.7.4': ^10.7.4 # GHSA-rxp7-6hxx-x8q5 (via express-rate-limit)
  'katex@>=0.11.0 <0.18.2': ^0.18.2 # GHSA-238p-pmpm-9mq7 (via @copilotkit/react-core > streamdown)
  'zod@<4.6.6': ^4.6.6 # GHSA-mrhx-c7xc-m3w5, no 3.x fix (via @ag-ui/proto)
