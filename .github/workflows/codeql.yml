name: CodeQL

# Static analysis for the XSS review (ROADMAP section 3): CodeQL's
# security-extended queries trace backend and user content into DOM sinks
# (innerHTML, href, src, srcdoc) across the packages. Findings appear under
# Security → Code scanning; the payload tests in packages/widget/test/xss.test.ts
# cover what the queries cannot see (our own escaping and URL checks).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 09:30 UTC: new queries ship with CodeQL releases.
    - cron: '30 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - packages
            paths-ignore:
              - '**/test/**'
              - '**/dist/**'
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
